[project]
name = "splitset-sync"
version = "0.1.0"
description = "Pulls activities, wellness and per-activity detail from intervals.icu into Splitset's Postgres, for every connected user."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
splitset-sync = "splitset_sync.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splitset_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
