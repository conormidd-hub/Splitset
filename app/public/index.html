<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover hands the notch and home indicator insets to the safe-area views;
         maximum-scale=1 stops iOS zooming into a field on focus (pinch zoom still works) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Add to Home Screen: open full screen, like an installed app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Splitset" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- the browser tab's icon: the Splitset logo, cropped tight so it reads at tab size -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- the two palettes' backgrounds, so there is no white flash before the app draws -->
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #eef0f4;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0d0d0d;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView>; no rubber-band bounce of the whole page */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The launch screen (the supplied SplitSet loader, in the app's dark theme), drawn while the
         app's script downloads. It sits outside #root so React leaves it alone;
         src/components/splash/LaunchSplash.tsx fades it out and removes it once the app has
         loaded, and draws the same screen itself on iOS and Android. */
      .ss-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
        overflow: hidden;
        transition: opacity 350ms ease;
      }
      .ss-loading-screen--leaving { opacity: 0; pointer-events: none; }
      .ss-loading-lockup { display: flex; flex-direction: column; align-items: center; }
      .ss-loading-symbol { position: relative; width: min(69vw, 300px); aspect-ratio: 855 / 790; }
      .ss-loading-half {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        will-change: clip-path, transform, opacity;
      }
      .ss-loading-outdoors { animation: ss-outdoors-reveal 700ms cubic-bezier(.22,1,.36,1) 130ms both; }
      .ss-loading-strength { animation: ss-strength-reveal 740ms cubic-bezier(.22,1,.36,1) 470ms both; }
      .ss-loading-wordmark {
        display: block;
        width: min(76vw, 320px);
        height: auto;
        aspect-ratio: 950 / 116;
        margin-top: 8px;
        animation: ss-wordmark-reveal 490ms cubic-bezier(.22,1,.36,1) 1050ms both;
      }
      .ss-loading-activity {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 27px;
        animation: ss-dashes-enter 400ms ease-out 1540ms both;
      }
      .ss-loading-activity > span {
        display: block;
        width: 15px;
        height: 3px;
        border-radius: 12px;
        background: #2bd894;
        opacity: .18;
        animation: ss-dash-breathe 1250ms ease-in-out infinite;
      }
      .ss-loading-activity > span:nth-child(2) { animation-delay: 180ms; }
      .ss-loading-activity > span:nth-child(3) { animation-delay: 360ms; }
      @keyframes ss-outdoors-reveal {
        0% { opacity: 0; transform: translate3d(-9px,-7px,0); clip-path: inset(0 100% 0 0); }
        22% { opacity: 1; }
        100% { opacity: 1; transform: translate3d(0,0,0); clip-path: inset(0); }
      }
      @keyframes ss-strength-reveal {
        0% { opacity: 0; transform: translate3d(9px,7px,0); clip-path: inset(0 0 0 100%); }
        22% { opacity: 1; }
        100% { opacity: 1; transform: translate3d(0,0,0); clip-path: inset(0); }
      }
      @keyframes ss-wordmark-reveal {
        from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(4px); }
        to { opacity: 1; clip-path: inset(0); transform: translateY(0); }
      }
      @keyframes ss-dashes-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes ss-dash-breathe { 0%, 100% { opacity: .18; } 45% { opacity: .92; } }
      @media (prefers-reduced-motion: reduce) {
        .ss-loading-half, .ss-loading-wordmark, .ss-loading-activity, .ss-loading-activity > span {
          animation: none !important;
          clip-path: none !important;
          opacity: 1;
          transform: none !important;
        }
        .ss-loading-activity > span { opacity: .4; }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <div id="boot" class="ss-loading-screen" role="status" aria-label="Loading SplitSet" aria-live="polite">
      <div class="ss-loading-lockup">
        <div class="ss-loading-symbol" aria-hidden="true">
          <img class="ss-loading-half ss-loading-outdoors" src="/splash/outdoors.png" alt="" />
          <img class="ss-loading-half ss-loading-strength" src="/splash/strength.png" alt="" />
        </div>
        <img class="ss-loading-wordmark" src="/splash/wordmark.png" alt="SplitSet" />
        <div class="ss-loading-activity" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
  </body>
</html>
