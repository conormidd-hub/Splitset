name: migrate

# Applies new database migrations to Supabase as soon as they reach main, so the sync job and
# the app never run ahead of the schema they need. `supabase db push` only applies migrations
# that the project's history table hasn't recorded yet, so a run with nothing new does nothing.
#
# It uses the same SUPABASE_DB_URL secret as the sync job (the Session pooler URI).
#
# After the push it seeds the exercise library (supabase/seed_library.py), so a migration or a
# library change reaches the database in one step. The loader writes only what differs, so a
# run with nothing new changes nothing.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/seed_library.py", "data/exercise_library.json", ".github/workflows/migrate.yml"]
  workflow_dispatch:

# never two pushes at once; a newer one waits for the one running
concurrency:
  group: splitset-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # an exact version downloads straight from the release; `latest` asks GitHub's API
          # first, which shared runners can find rate limited
          version: 2.120.0
      - name: Migrations waiting to be applied
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply them
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "sync/uv.lock"
      - name: Seed the exercise library
        working-directory: sync
        run: |
          uv sync --frozen
          uv run python ../supabase/seed_library.py
