name: app

# data/ and the body figures count as app files: the bundle imports data/recovery_constants.json,
# and the tests check the fixtures, libraryOrder.ts and bodySvg.ts against data/ and assets/
on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", "assets/body-*.svg", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "data/**", "assets/body-*.svg", ".github/workflows/app.yml"]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
